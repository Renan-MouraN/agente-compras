server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Encaminha /api/* para o backend (mesma origem para o navegador: sem CORS).
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # O agente pode fazer várias rodadas com o LLM; o timeout fica acima do do frontend.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}
